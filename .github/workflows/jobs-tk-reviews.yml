name: TK reviews refresh

# Keeps the BİZ page's passenger-review corpus (App Store, Skytrax, Reddit
# r/TurkishAirlines) from going stale. `refresh-tk-reviews` already existed as
# a manual-dispatch-only maintenance task; this just puts it on a clock.
# Reviews trickle in far slower than news articles, so every 6h is plenty --
# matching the 2h news cadence would just re-scrape the same handful of pages.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-tk-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh TK reviews (+ digest when the corpus changes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-120b
          LLM_MODEL_FAST: openai/gpt-oss-20b
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m app.cli refresh-tk-reviews
