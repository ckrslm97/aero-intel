name: News ingest + enrich

# Ingest RSS, dedup, and enrich (categorise + real Turkish translation) via
# Groq. Enrichment is capped per run (LLM_ENRICH_BATCH_SIZE) so a single run
# can't drain Groq's free daily budget: 12 runs/day x 12 articles = ~140/day,
# which is the ceiling the model split (20b classify / 120b translate) affords.
# The backlog is worked off over subsequent runs.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-news
  cancel-in-progress: false

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest + dedup + enrich (Groq)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-120b
          LLM_MODEL_FAST: openai/gpt-oss-20b
          # Raised from 12: the relevance gate (app/pipeline/relevance.py) keeps
          # low-signal articles off the LLM entirely, and translation now costs
          # one call instead of two, so the same token budget covers more.
          LLM_ENRICH_BATCH_SIZE: "24"
          # "Filter first, then translate" (see app/pipeline/enrich.py
          # _should_translate). Translation used to run for EVERY article on
          # the LLM path -- 24 x 12 = 288 calls/day -- selected for carrying any
          # commercial-aviation signal rather than for being worth printing.
          # 0.55 is measured: 26.8% of the LLM path clears it on the production
          # archive, so the inline path drops to ~102 calls/day.
          #
          # THE ROLLBACK: translation is effectively the publication gate (the
          # Gazete queries translated_only=true), so if the paper thins out
          # after this ships, set TRANSLATE_ALL_ENRICHED to "true" here. That
          # restores the previous behaviour exactly, with no code change and no
          # deploy. Watch the first 24 hours before tuning the floor up.
          TRANSLATE_MIN_INTELLIGENCE: "0.55"
          TRANSLATE_ALL_ENRICHED: "false"
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.cli full-cycle
          # Pick the day's critical stories and spend the model on them.
          #
          # Runs AFTER full-cycle so it sees the articles this run just
          # enriched. Per-category quotas (RM 8 / Havalimanı 5 / Etkinlik 5)
          # cap one run at 18 calls, but an article scored once is never
          # re-scored, so twelve runs a day cost far less than 12 x 18: the
          # real bound is how many new articles land in the three printed
          # sections, ~32/day in production. --limit is the hard ceiling.
          python -m app.cli select-critical --limit 20
          # Articles enriched before a translator was configured (or skipped by
          # the gate on a busy day) had no automatic drain at all -- the command
          # existed but ran only on manual dispatch.
          #
          # Raised 8 -> 12 because the limit now means something different.
          # This queue used to be "drain the oldest N of an unbounded backlog"
          # and is now "translate up to N of the day's CRITICAL stories" --
          # it is filtered by TRANSLATE_MIN_INTELLIGENCE and ordered by
          # intelligence_score, so a bigger number buys coverage of the stories
          # that matter instead of a deeper trawl through wire copy.
          python -m app.cli translate-backlog --limit 12

      - name: Pipeline v2 (Faz 16 dual-write)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINE_V2: "true"
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-120b
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Turned on once the campaign quality gate passed on the article
          # path: false-positive rate 11.3% -> 5.1% (< the 10% bar) with recall
          # still 100%, after the rulepacks learned the award/kargo/service
          # -announcement vocabulary. `evaluate-campaigns` is the measurement
          # and app/tests/test_golden_eval_service.py asserts the two agree, so
          # this line cannot quietly outlive the number that justifies it.
          CAMPAIGN_V2_ENABLED: "true"
          # Shares the Groq key and daily budget with the enrich/translate
          # calls above, so this starts deliberately small: 10 articles x 12
          # runs/day = ~120 extra calls, on top of the ~140/day the comment
          # above already budgets for v1. Watch usage during the dual-write
          # window before raising it.
        run: python -m app.cli pipeline-v2 --limit 10
