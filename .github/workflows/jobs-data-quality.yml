name: Data quality

# Faz 13's daily gate: five invariants over what's actually published (see
# app/services/data_quality_service.py). A red run here IS the "task" a
# violation opens -- no separate ticketing system to keep in sync with this
# one. Runs after the news/KPI/campaign jobs have had a chance to run at
# least once in the day, so a quiet morning isn't mistaken for a stale feed.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-data-quality
  cancel-in-progress: false

jobs:
  check-data-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Belt and braces against the scheduler. The deep-scan workflow already
      # generates alerts at the end of each sweep, but GitHub's cron is
      # measured 2-2.75h late on this repo and a workflow can be skipped
      # outright during an incident -- and an EXPIRING warning that arrives
      # after the campaign closed is worthless. Running it here too costs
      # nothing when the deep scan already did the work: every alert's dedupe
      # key is bucketed on a property of the campaign rather than on the run
      # time, so this pass writes only what the earlier one missed.
      #
      # Before the quality check, not after: a red quality gate must not be
      # able to swallow the day's alerts.
      - name: Generate campaign alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head
          python -m app.cli generate-campaign-alerts

      - name: Check data quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.cli check-data-quality
