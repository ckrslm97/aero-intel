name: Market Pulse

# One short LLM synthesis a day over Kokpit's own already-curated numbers
# (see app/services/market_pulse_service.py). Deliberately not tied to the
# 15-minute KPI refresh: a paragraph that changes every 15 minutes isn't a
# daily read, it's noise, and it would burn the same LLM budget the news
# pipeline needs.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-market-pulse
  cancel-in-progress: false

jobs:
  refresh-market-pulse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Market Pulse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-120b
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.cli refresh-market-pulse
