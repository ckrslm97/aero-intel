name: Maintenance

# Manually-triggered one-off operations: first-time seeding, data cleanup,
# re-translating the backlog, creating the admin user, or forcing a migration.
# Pick a task from the dropdown when dispatching.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which maintenance task to run"
        required: true
        type: choice
        options:
          - alembic-upgrade
          - seed-kpi-history
          - seed-events
          - seed-tk-reviews
          - refresh-tk-reviews
          - seed-promos
          - prune-kpi-duplicates
          - seed-curated-data
          - re-enrich
          - reclassify
          - backfill-risks
          - repair-etna-article-content
          - repair-translations
          - clean-headlines
          - translate-backlog
          - build-insight
          - evaluate-golden
          - evaluate-campaigns
          - check-data-quality
          - mark-legacy-campaigns-superseded
          - backfill-campaign-classes
      days:
        description: "re-enrich only: limit to articles fetched in the last N days (blank = all)"
        required: false
        type: string
      limit:
        description: "translate-backlog: how many articles to translate this run (default 12). backfill-risks: how many articles to scan (blank = all)"
        required: false
        type: string
      full_surface:
        description: "evaluate-golden only: risk | news | campaign -- runs the live re-fetch + classify pass for that surface (costs LLM calls). Blank = deterministic checks only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Serialise with itself; do not fight the scheduled jobs' own groups.
  group: maintenance
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ inputs.task }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # re-enrich needs the live translator; harmless for the other tasks.
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: openai/gpt-oss-120b
          LLM_MODEL_FAST: openai/gpt-oss-20b
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DAYS: ${{ inputs.days }}
          LIMIT: ${{ inputs.limit }}
          FULL_SURFACE: ${{ inputs.full_surface }}
        run: |
          set -euo pipefail
          case "${{ inputs.task }}" in
            alembic-upgrade)
              alembic upgrade head ;;
            seed-kpi-history)
              alembic upgrade head
              python -m app.cli seed-kpi-history ;;
            seed-events)
              alembic upgrade head
              python -m app.cli seed-events ;;
            seed-tk-reviews)
              alembic upgrade head
              python -m app.cli seed-tk-reviews ;;
            refresh-tk-reviews)
              # Pulls new reviews off Skytrax / App Store / Reddit; rebuilds
              # the BİZ digest only if anything new actually landed.
              alembic upgrade head
              python -m app.cli refresh-tk-reviews ;;
            seed-promos)
              alembic upgrade head
              python -m app.cli seed-promos ;;
            prune-kpi-duplicates)
              python -m app.cli prune-kpi-duplicates ;;
            seed-curated-data)
              # Reconciles fx_forecasts/iata_indicators to app/ingest/curated_seed.py --
              # run after every PR that edits that file, same as seed-kpi-history.
              alembic upgrade head
              python -m app.cli seed-curated-data ;;
            re-enrich)
              if [ -n "${DAYS}" ]; then
                python -m app.cli re-enrich --days "${DAYS}"
              else
                python -m app.cli re-enrich
              fi ;;
            reclassify)
              python -m app.cli reclassify ;;
            backfill-risks)
              if [ -n "${LIMIT}" ]; then
                python -m app.cli backfill-risks --limit "${LIMIT}"
              else
                python -m app.cli backfill-risks
              fi ;;
            repair-etna-article-content)
              python -m app.cli repair-etna-article-content ;;
            repair-translations)
              python -m app.cli repair-translations ;;
            clean-headlines)
              python -m app.cli clean-headlines ;;
            translate-backlog)
              python -m app.cli translate-backlog --limit "${LIMIT:-12}" ;;
            build-insight)
              python -m app.cli build-insight ;;
            evaluate-golden)
              if [ -n "${FULL_SURFACE}" ]; then
                python -m app.cli evaluate-golden --full-surface "${FULL_SURFACE}"
              else
                python -m app.cli evaluate-golden
              fi ;;
            evaluate-campaigns)
              # PR8's campaign quality gate: precision / recall / false-positive
              # rate over the golden campaign surface. Fully deterministic --
              # no LLM, no network, no database -- so it costs nothing to run
              # and its numbers are reproducible run to run.
              python -m app.cli evaluate-campaigns ;;
            check-data-quality)
              python -m app.cli check-data-quality ;;
            mark-legacy-campaigns-superseded)
              python -m app.cli mark-legacy-campaigns-superseded ;;
            backfill-campaign-classes)
              # Re-runs the business-class rulepacks over the rows already in
              # the table: loyalty/product/evergreen/news rows the v1 pipeline
              # published are retired (superseded, never deleted) and their
              # open alerts acknowledged. Heuristic-only -- no LLM calls, so
              # it is safe to re-run after any change to the keyword tables.
              python -m app.cli backfill-campaign-classes ;;
            *)
              echo "Unknown task: ${{ inputs.task }}" >&2
              exit 1 ;;
          esac
